name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert HTML to APK
        uses: kimhuilim/html-to-apk-action@v1.0.1
        with:
          build-folder-path: '.'
          app-name: 'MyAIApp'
          output-folder-path: 'apk/'

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-App-APK
          path: apk/*.apk
          
