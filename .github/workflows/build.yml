name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Webview APK
        uses: ftnt/action-html-to-apk@v1.0.0
        with:
          input_dir: '.'
          app_name: 'MyAIApp'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAIApp-APK
          path: '*.apk'
          
